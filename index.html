<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up-Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <div class="img">
            <img src="images/halie-west-25xggax4bSA-unsplash.jpg"  s>
        </div>

        <div class="login-page">
            <div class="service">This is not a real online service! You know you need something <br> like this in your life to help you realize your deepest dreams. <br> Sign up now to get started. <br> <br> You know you want to.</div>
            <div class="form">
                <form action="#">
                    <div class="form-container">
                        <h1>Let's do this!</h1>

                        <div class="left-side">
                            <div>
                                <div>
                                    <label for="first-name">FIRST NAME</label> <br>
                                    <input type="text" id="first-name">
                                </div>
                                <div>
                                    <label for="user-email">EMAIL</label><br>
                                    <input type="email" name="email" id="user-email">
                                </div>
                                <div>
                                    <label for="password">PASSWORD</label><br>
                                    <input type="password" id="password" name="password"><br>
                                </div>
                            </div>
                            <div>
                                <div>
                                    <label for="last-name">LAST NAME</label><br>
                                    <input type="text" id="last-name" name="last-name">
                                </div>
                                <div>
                                    <label for="phone-number">PHONE NUMBER</label><br>
                                    <input type="number" id="phone-number" name="phone-number">
                                </div>
                                <div>
                                    <label for="user-password">CONFIRM PASSWORD</label><br>
                                    <input type="password" name="confirm-password" id="user-password">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="create">
                <button>Create Account</button>
                <div class="log-in">
                    <div>Alredy have an account?</div>
                    <div><a href="">Log in</a></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
