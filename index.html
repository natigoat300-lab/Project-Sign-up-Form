<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up-Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">

        <div class="odin"></div>

        <div class="login-page">
            <div class="service">This is not a real online service! You know you need something <br> like this in your life to help you realize your deepest dreams. <br> Sign up now to get started. <br> <br> You know you want to.</div>
            <div class="form">
                <form action="#">
                    <div class="form-container">
                        <div class="left-side">
                            <div>Let's do this!</div>
                            <div>
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" id="first-name">
                            </div>
                            <div>
                                <label for="user-email">EMAIL</label>
                                <input type="email" name="email" id="user-email">
                            </div>
                            <div>
                                <label for="password">PASSWORD</label>
                                <input type="password" id="password" name="password">
                            </div>
                        </div>
                        <div class="left-side">
                            <div> 
                                <label for="last-name">LAST NAME</label>
                                <input type="text" id="last-name" name="last-name">
                            </div>
                            <div>
                                <label for="phone-number">PHONE NUMBER</label>
                                <input type="number" id="phone-number" name="phone-number">
                            </div>
                            <div>
                                <label for="user-password">CONFIRM PASSWORD</label>
                                <input type="password" name="confirm-password" id="user-password">
                            </div>

                        </div>
                    </div>
                </form>
            </div>
            <div class="create">
                <button>Create Account</button>
                <div>Alredy have an account?<span><a href="#">Log in</a></span></div>
            </div>
        </div>
    </div>

</body>
</html>
